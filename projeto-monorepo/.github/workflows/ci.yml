name: Monorepo CI Pipeline

on:
    # Dispara automaticamente ao enviar novos commits para a branch main
    push: 
        branches: 
            - main
    # Dispara na abertura ou atualização de Pull Request direcionados para a branch main
    pull_request: 
        branches: 
            - main
    # Permite execução manual pelo painel web do Github ( aba Actions -> Run workflow)
    workflow_dispatch: 

jobs:
    validar-monorepo:
        name: Validar Backend, Frontend e Docker
        runs-on: ubuntu-latest

        steps:
            - name: 1. Baixar o codigo fonte
              uses: actions/checkout@v4

            - name: 2. Habilitar o pnpm
              uses: pnpm/action-setup@v4
              with:
                version: 11

            - name: 3. Configurar o Node.js 24 com Cache de Dependencias
              uses: actions/setup-node@v4
              with:
                node-version: 24

            - name: 4. Instalar Dependencias do Backend
              run: |
                cd backend
                pnpm install --frozen-lockfile

            - name: 5. Validar Tipos e Compilar o Backend (Express)
              run: |
                cd backend
                pnpm run build

            - name: 5.1. Validar Tipos e Compilar o Frontend (quando presente no monorepo)
              run: |
                if [ -d "app" ]; then
                  echo "Subprojeto frontend encontrado. Iniciando validação..."
                  cd app
                  pnpm install --frozen-lockfile
                  pnpm run build
                else 
                  echo "Subprojeto app ainda não adicionado ao monorepo."
                fi

            - name: 5.2 Validar formatação do código com Prettier
              run: |
                npx prettier --check . 

                
            -name: 5.3 checagem de tipo no backend (tsc --noEmit)
              run: |
                cd backend
                npx tsc --noEmit

            - name: 6. Validar Contrução da Imagem Docker da API
              run: |
                docker build -t api-service:test ./backend

            - name: 7. Validar Frontend (quando presente no monorepo)
              run: |
                if [ -d "app"]; then
                  echo "Subprojeto frontend encontrado. Iniciando validação..."
                  cd app
                  pnpm install --frozen-lockfile
                  pnpm run build
                  docker build -t app-service:test ./app
                else 
                  echo "Subprojeto app ainda não adicionado ao monorepo."
                fi

            - name: 8. Resumo da execução
              run: |
                echo "Integração Continua concluida com sucesso!"
                echo "Autor da alteração: ${{ github.actor }}"
                echo "Commit validado: ${{ github.sha }}"

            - name: 9. Limpar imagens Docker de teste
              run: |
                docker rmi api-service:test || true
                docker rmi app-service:test || true

            - name: 10. Finalizar execução
              run: |
                echo "Pipeline de CI finalizado."

            - name: 11. Notificar sucesso ou falha
              if: failure()
              run: |
                echo "A execução do pipeline falhou. Verifique os logs acima para detalhes."

            - name: 12. Notificar sucesso
              if: success()
              run: |
                echo "A execução do pipeline foi concluída com sucesso!"
            
            - name: 13. Limpar cache do pnpm
              run: |
                pnpm store prune

            - name: 14. Limpar cache do Node.js
              run: |
                npm cache clean --force
                
            - name: 15. Limpar cache do Docker
              run: |
                docker system prune -f

            

            
