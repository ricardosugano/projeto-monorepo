name: Monorepo CI Pipeline

on:
  # Dispara automaticamente ao enviar novos commits para a branch master
  push:
    branches:
      - master
  # Dispara na abertura ou atualização de Pull Requests direcionados para a branch master
  pull_request:
    branches:
      - master
  # Permite execução manual pelo painel web do Github Actions
  workflow_dispatch:

# Permite cancelar execuções anteriores na mesma branch se novos commits forem enviados
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Validações Estáticas e Testes Unitários Rápidos (Fail-Fast)
  validacoes-e-testes:
    name: 1. Qualidade, Tipos e Testes Unitários
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test

    steps:
      - name: 1. Baixar o código-fonte
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necessário para o SonarQube analisar o histórico

      - name: 2. Habilitar o pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 3. Configurar o Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 4. Instalar Dependências do Backend
        run: |
          cd backend
          pnpm install --frozen-lockfile

      - name: 5. Validar Padronização de Código (ESLint)
        run: |
          cd backend
          pnpm run lint

      - name: 6. Validar Formatação de Arquivos (Prettier)
        run: |
          cd backend
          pnpm run format:check

      - name: 7. Checagem de Tipos no Backend (tsc --noEmit)
        run: |
          cd backend
          pnpm run type-check

      - name: 8. Executar Testes Unitários e de Integração com Vitest (com cobertura)
        run: |
          cd backend
          pnpm run test:coverage

      - name: 9. Executar Análise Estática de Código com SonarQube
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.projectKey=projeto-monorepo
            -Dsonar.organization=ricardosugano
            -Dsonar.javascript.lcov.reportPaths=backend/coverage/lcov.info

      - name: 10. Validar Quality Gate do SonarQube
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: 11. Publicar Relatório de Cobertura no Resumo do Job
        if: always()
        run: |
          echo "### Relatório de Cobertura de Testes" >> $GITHUB_STEP_SUMMARY
          if [ -f backend/coverage/lcov.info ]; then
            echo "Relatório de cobertura do backend gerado com sucesso." >> $GITHUB_STEP_SUMMARY
          else
            echo "Relatório de cobertura não encontrado." >> $GITHUB_STEP_SUMMARY
          fi
          echo "Execução de testes e inspeção estática concluídas para o commit ${{ github.sha }}." >> $GITHUB_STEP_SUMMARY

      - name: 12. Salvar Artefatos de Cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage
          if-no-files-found: warn

  # Job 2: Compilação de Produção e Imagens Docker (Só executa se o Job 1 passar)
  build-e-docker:
    name: 2. Compilação e Imagens Docker
    needs: validacoes-e-testes
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar o código-fonte
        uses: actions/checkout@v4

      - name: 2. Habilitar o pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 3. Configurar o Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 4. Instalar Dependências do Backend
        run: |
          cd backend
          pnpm install --frozen-lockfile

      - name: 5. Validar Tipos e Compilar o Backend (Express)
        run: |
          cd backend
          pnpm run build

      - name: 6. Validar Construção da Imagem Docker da API
        run: |
          docker build -t api-service:test ./backend

      - name: 7. Validar Frontend e sua Imagem Docker (quando presente no monorepo)
        run: |
          if [ -d "app" ]; then
            echo "Subprojeto frontend encontrado. Iniciando validação..."
            cd app
            pnpm install --frozen-lockfile
            pnpm run build
            cd ..
            docker build -t app-service:test ./app
          else
            echo "Subprojeto app ainda não adicionado ao monorepo."
          fi

      - name: 8. Resumo da Execução
        run: |
          echo "### Resumo da Execução do Pipeline de CI" >> $GITHUB_STEP_SUMMARY
          echo "Integração Contínua concluída com sucesso!" >> $GITHUB_STEP_SUMMARY
          echo "- Autor: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
